# Local PostgreSQL for development. Reads DB_* values from .env
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-homeseek}
      POSTGRES_USER: ${DB_USERNAME:-homeseek}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - homeseek-data:/var/lib/postgresql/data
volumes:
  homeseek-data:
